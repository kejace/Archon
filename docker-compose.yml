# Archon containerized runtime.
#
#   docker compose build
#   mkdir -p workspace
#   docker compose run --rm archon          # interactive shell in /workspace
#
# Inside the container, authenticate Claude Code (run `claude` once, or set
# ANTHROPIC_API_KEY in .env), then:
#   archon init /workspace/myproject
#   archon loop /workspace/myproject
# The dashboard auto-starts on a free port in 8080-8099, published to the host.

services:
  archon:
    build:
      context: .
      dockerfile: Dockerfile
    image: archon:latest
    # Mount your Lean project(s) here. Anything under ./workspace on the host
    # is visible at /workspace in the container.
    volumes:
      - ./workspace:/workspace
      # Persist Claude Code auth (and Archon's per-user state) across runs so
      # you don't re-login every `docker compose run`.
      - archon-claude:/home/archon/.claude
    # Dashboard picks a free port in this range and prints the URL.
    ports:
      - "8080-8099:8080-8099"
    # API keys live in each project's <project>/.archon/.env, which Archon
    # loads itself. We deliberately do NOT inject ANTHROPIC_API_KEY /
    # OPENROUTER_API_KEY / etc. here: a `${VAR:-}` passthrough sets the var to
    # an EMPTY string inside the container, and Archon's loader uses
    # os.environ.setdefault() — so an empty-but-present var SHADOWS the real
    # value in .archon/.env and silently disables that provider.
    # If you prefer host-level keys, pass them explicitly at run time instead,
    # e.g. `OPENROUTER_API_KEY=sk-... docker compose run --rm archon` plus an
    # `environment: [OPENROUTER_API_KEY]` list-style entry (no `:-` default).
    env_file:
      - path: .env
        required: false
    environment:
      # Bind the dashboard to all interfaces so the published ports above are
      # reachable from the host browser (the image sets this too; kept here for
      # visibility / `docker run` parity).
      ARCHON_DASHBOARD_HOST: 0.0.0.0
      # Keep ALL of Claude Code's config (not just credentials) inside the
      # persisted ~/.claude volume. Without this, ~/.claude.json (onboarding /
      # theme / login state) lives at HOME root, outside the volume, so the
      # interactive `archon discuss` TUI re-onboards every container. The image
      # sets this too; kept here for `docker run` parity. Must match the
      # archon-claude mount target below.
      CLAUDE_CONFIG_DIR: /home/archon/.claude
    # Interactive: archon init / discuss prompt for input.
    stdin_open: true
    tty: true

volumes:
  archon-claude:
